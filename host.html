<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>答題擂台｜主持人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@500;600;700;800;900&family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="quiz-data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  'use strict';
  var QA = window.QA;
  var SESSION_KEY = 'qa_host_game_v1';

  var game = {
    code: null,
    es: null,
    seq: 0,
    phase: 'idle', // idle | lobby | announcement | question | reveal | podium
    qIndex: -1,
    questionStartedAt: null,
    players: {},           // clientId -> name  (只用來顯示名單)
    answersForQ: {},        // clientId -> {name, optionIndex, elapsedMs}  (僅限目前這一題)
    scores: {},             // clientId -> {name, score}
    revealTally: null,
    revealGains: null
  };
  var resumeOffer = null; // 偵測到的舊場次（尚未決定要不要繼續）
  var notice = null;

  var app = document.getElementById('app');

  function setNotice(msg) {
    notice = msg;
    render();
    clearTimeout(setNotice._t);
    setNotice._t = setTimeout(function () { notice = null; render(); }, 2600);
  }

  function saveSession() {
    try {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        code: game.code, seq: game.seq, phase: game.phase, qIndex: game.qIndex,
        questionStartedAt: game.questionStartedAt, players: game.players,
        scores: game.scores, revealTally: game.revealTally, revealGains: game.revealGains
      }));
    } catch (e) {}
  }
  function clearSession() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  }
  function loadSession() {
    try {
      var raw = sessionStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (d && d.code && d.phase && d.phase !== 'idle') return d;
    } catch (e) {}
    return null;
  }

  // ---------------------------------------------------------------------
  // 連線 / 廣播
  // ---------------------------------------------------------------------
  function connect(code) {
    if (game.es) { try { game.es.close(); } catch (e) {} }
    game.es = new EventSource(QA.ntfySseUrl(code));
    game.es.onmessage = function (e) {
      var msg = QA.parseEnvelope(e.data);
      if (!msg || !msg.type) return;
      if (msg.type === 'join' && msg.clientId && msg.name) {
        game.players[msg.clientId] = msg.name;
        render();
      } else if (msg.type === 'answer') {
        if (game.phase !== 'question' || msg.qIndex !== game.qIndex) return;
        if (game.answersForQ[msg.clientId]) return; // 同一題只收第一次送出的答案
        game.answersForQ[msg.clientId] = { name: msg.name, optionIndex: msg.optionIndex, elapsedMs: msg.elapsedMs };
        render();
      }
      // type === 'state' 是主持人自己廣播出去的訊息，收到自己的回音不用處理
    };
  }

  function broadcastState() {
    game.seq++;
    saveSession();
    QA.publish(game.code, {
      type: 'state', seq: game.seq, ts: Date.now(),
      phase: game.phase, qIndex: game.qIndex, questionStartedAt: game.questionStartedAt,
      scores: game.scores, revealTally: game.revealTally, revealGains: game.revealGains
    });
    render();
  }

  // ---------------------------------------------------------------------
  // 遊戲流程
  // ---------------------------------------------------------------------
  function startNewGame() {
    clearSession();
    game.code = QA.genCode();
    game.seq = 0; game.phase = 'lobby'; game.qIndex = -1; game.questionStartedAt = null;
    game.players = {}; game.answersForQ = {}; game.scores = {};
    game.revealTally = null; game.revealGains = null;
    connect(game.code);
    broadcastState();
  }

  function resumeGame(d) {
    game.code = d.code; game.seq = d.seq || 0; game.phase = d.phase; game.qIndex = d.qIndex;
    game.questionStartedAt = d.questionStartedAt; game.players = d.players || {};
    game.scores = d.scores || {}; game.revealTally = d.revealTally; game.revealGains = d.revealGains;
    game.answersForQ = {};
    connect(game.code);
    broadcastState();
  }

  function goToSlide(idx) {
    var slides = window.QUIZ.questions;
    if (idx >= slides.length) {
      game.phase = 'podium';
      broadcastState();
      return;
    }
    var slide = slides[idx];
    game.qIndex = idx;
    game.phase = slide.type === 'announcement' ? 'announcement' : 'question';
    game.questionStartedAt = Date.now();
    game.answersForQ = {};
    game.revealTally = null; game.revealGains = null;
    broadcastState();
  }
  function hostStart() { goToSlide(0); }
  function hostReveal() {
    if (game.phase !== 'question') return;
    var q = window.QUIZ.questions[game.qIndex];
    var tally = [0, 0, 0, 0];
    var gains = {};
    Object.keys(game.answersForQ).forEach(function (cid) {
      var a = game.answersForQ[cid];
      if (a.optionIndex >= 0 && a.optionIndex < 4) tally[a.optionIndex]++;
      var correct = a.optionIndex === q.correctIndex;
      var gained = QA.computeGain(correct, a.elapsedMs, q.duration);
      gains[cid] = gained;
      var prev = game.scores[cid] || { name: a.name, score: 0 };
      game.scores[cid] = { name: a.name || prev.name, score: (prev.score || 0) + gained };
    });
    game.phase = 'reveal';
    game.revealTally = tally;
    game.revealGains = gains;
    broadcastState();
  }
  function hostNext() { goToSlide(game.qIndex + 1); }
  function hostEnd() {
    try { if (game.es) game.es.close(); } catch (e) {}
    clearSession();
    game.code = null; game.es = null; game.phase = 'idle'; game.qIndex = -1;
    game.players = {}; game.answersForQ = {}; game.scores = {};
    render();
  }

  // ---------------------------------------------------------------------
  // 畫面
  // ---------------------------------------------------------------------
  function topbar() {
    return '<div class="topbar">' +
      '<div class="brand"><b>答題擂台</b><span>主持人模式</span></div>' +
      (game.code ? '<button class="btn btn-ghost btn-icon" data-action="host-end">結束遊戲</button>' : '') +
      '</div>';
  }

  function renderRoster() {
    var ids = Object.keys(game.players);
    if (!ids.length) return '<p style="color:var(--muted)">還沒有玩家加入…把代碼分享給大家吧！</p>';
    var html = '<div class="roster">';
    ids.forEach(function (cid) {
      html += '<span class="pchip">' + QA.esc(game.players[cid]) + '</span>';
    });
    html += '</div>';
    return html;
  }

  function answeredCount() { return Object.keys(game.answersForQ).length; }

  function renderIdle() {
    var html = '<div class="shell">' + topbar();
    if (resumeOffer) {
      html += '<div class="card stack center">' +
        '<p class="eyebrow">偵測到尚未結束的場次</p>' +
        '<p>房間代碼 <b>' + QA.esc(resumeOffer.code) + '</b>，要繼續剛剛的遊戲嗎？</p>' +
        '<div class="row" style="justify-content:center">' +
        '<button class="btn btn-primary" data-action="resume-yes">繼續剛剛的遊戲</button>' +
        '<button class="btn btn-ghost" data-action="resume-no">開新的一場</button>' +
        '</div></div>';
    } else {
      var qCount = window.QUIZ.questions.filter(function (q) { return q.type !== 'announcement'; }).length;
      html += '<div class="card stack center">' +
        '<p class="eyebrow">' + QA.esc(window.QUIZ.title) + '</p>' +
        '<p style="color:var(--muted)">共 ' + qCount + ' 題，準備好就可以開始囉</p>' +
        '<button class="btn btn-primary btn-lg btn-block" data-action="start-new">開始遊戲</button>' +
        '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderLobby() {
    var html = '<div class="shell shell-wide">' + topbar();
    html += '<div class="roomcode-box"><p class="eyebrow">遊戲代碼</p><div class="code">' + QA.esc(game.code) + '</div>' +
      '<p style="color:var(--muted);margin-top:6px">請大家打開參與者連結，輸入這組代碼加入</p></div>';
    html += '<div class="card stack"><p class="eyebrow">目前玩家</p>' + renderRoster() + '</div>';
    html += '<button class="btn btn-primary btn-lg btn-block" data-action="host-start-game">開始遊戲</button>';
    html += '</div>';
    return html;
  }

  function renderAnnouncement() {
    var slide = window.QUIZ.questions[game.qIndex];
    var html = '<div class="shell shell-wide">' + topbar();
    html += '<div class="card stack center">' +
      '<p class="eyebrow">接下來的關卡</p>' +
      '<h2 style="font-size:28px">' + QA.esc(slide.title) + '</h2>' +
      (slide.subtitle ? '<p style="color:var(--muted)">' + QA.esc(slide.subtitle) + '</p>' : '') +
      '</div>';
    html += '<button class="btn btn-primary btn-lg btn-block" data-action="host-next">開始這一關</button>';
    html += '</div>';
    return html;
  }

  function renderQuestion() {
    var q = window.QUIZ.questions[game.qIndex];
    var progress = QA.questionProgress(game.qIndex);
    var total = q.duration * 1000;
    var elapsed = Date.now() - (game.questionStartedAt || Date.now());
    var remain = Math.max(0, total - elapsed);
    var pct = QA.clamp(remain / total * 100, 0, 100);
    var html = '<div class="shell shell-wide">' + topbar();
    html += '<div class="card stack">' +
      '<div class="spread"><span class="chip chip-accent">第 ' + progress.num + ' / ' + progress.total + ' 題</span><span class="chip">' + QA.esc(window.QUIZ.title) + '</span></div>' +
      '<p class="qtext">' + QA.esc(q.text) + '</p>' +
      '<div class="timerbar"><div style="width:' + pct + '%"></div></div>' +
      '<div class="spread"><span class="timernum">' + Math.ceil(remain / 1000) + ' 秒</span><span class="chip">已作答 ' + answeredCount() + ' 人</span></div>' +
      '<div class="tiles">';
    q.options.forEach(function (opt, i) {
      html += '<div class="tile ' + QA.TILE_CLASS[i] + '">' + QA.shapeSvg(i) + '<span>' + QA.esc(opt) + '</span></div>';
    });
    html += '</div>' +
      '<button class="btn btn-primary btn-lg btn-block" data-action="host-reveal">提前公布答案</button>' +
      '</div></div>';
    return html;
  }

  function renderReveal() {
    var progress = QA.questionProgress(game.qIndex);
    var q = window.QUIZ.questions[game.qIndex];
    var html = '<div class="shell shell-wide">' + topbar();
    html += '<div class="card stack">' +
      '<span class="chip chip-accent">第 ' + progress.num + ' / ' + progress.total + ' 題．公布結果</span>' +
      '<p class="qtext">' + QA.esc(q.text) + '</p>' +
      QA.renderTally(game.qIndex, game.revealTally) +
      (q.explanation ? '<div class="card-flat"><p class="eyebrow">小知識</p><p>' + QA.esc(q.explanation) + '</p></div>' : '') +
      '</div>';
    html += '<div class="card stack"><p class="eyebrow">排行榜</p>' + QA.leaderboardRows(game.scores, null, 10) + '</div>';
    var nextSlide = window.QUIZ.questions[game.qIndex + 1];
    var nextLabel = !nextSlide ? '查看最終結果' : (nextSlide.type === 'announcement' ? '前往下一關' : '下一題');
    html += '<button class="btn btn-primary btn-lg btn-block" data-action="host-next">' + nextLabel + '</button>';
    html += '</div>';
    return html;
  }

  function renderPodiumScreen() {
    var html = '<div class="shell shell-wide">' + topbar();
    html += QA.renderPodium(game.scores, null);
    html += '<button class="btn btn-primary btn-lg btn-block" data-action="host-end">結束遊戲</button>';
    html += '</div>';
    return html;
  }

  function render() {
    var html;
    if (game.phase === 'idle') html = renderIdle();
    else if (game.phase === 'lobby') html = renderLobby();
    else if (game.phase === 'announcement') html = renderAnnouncement();
    else if (game.phase === 'question') html = renderQuestion();
    else if (game.phase === 'reveal') html = renderReveal();
    else if (game.phase === 'podium') html = renderPodiumScreen();
    else html = renderIdle();
    if (notice) html += '<div class="toast">' + QA.esc(notice) + '</div>';
    app.innerHTML = html;
  }

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.getAttribute('data-action');
    if (action === 'start-new') startNewGame();
    else if (action === 'resume-yes') { resumeGame(resumeOffer); resumeOffer = null; }
    else if (action === 'resume-no') { clearSession(); resumeOffer = null; render(); }
    else if (action === 'host-start-game') hostStart();
    else if (action === 'host-reveal') hostReveal();
    else if (action === 'host-next') hostNext();
    else if (action === 'host-end') hostEnd();
  });

  setInterval(function () {
    if (game.phase === 'question') {
      var q = window.QUIZ.questions[game.qIndex];
      var elapsed = Date.now() - (game.questionStartedAt || Date.now());
      if (elapsed >= q.duration * 1000) { hostReveal(); return; }
      render();
    }
  }, 500);

  var saved = loadSession();
  if (saved) resumeOffer = saved;
  render();
})();
</script>
</body>
</html>
